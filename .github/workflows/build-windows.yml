name: Build Windows Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-mpfr
            mingw-w64-x86_64-eigen3
            mingw-w64-x86_64-gsl
            mingw-w64-x86_64-rust
            mingw-w64-x86_64-ccache

      - name: Cache C++ (ccache)
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "shanks-unified"

      - name: Build C++ Backend (libshanks_ffi.dll)
        run: |
          cd backend/ffi
          mkdir -p build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build .

      - name: Build Rust Frontend (shanks_unified.exe)
        run: |
          cd shanks-unified
          cargo build --release

      - name: Prepare Archive Folder
        run: |
          mkdir shanks-unified-windows
          
          # Copy our built binaries
          cp backend/ffi/build/bin/libshanks_ffi.dll shanks-unified-windows/
          cp shanks-unified/target/release/shanks-unified.exe shanks-unified-windows/
          
          # Copy configurations
          cp -r shanks-unified/config shanks-unified-windows/
          
          # Use ldd to find and copy all required MSYS2/MinGW DLLs (gmp, mpfr, gsl, libstdc++, libgcc, etc.)
          ldd shanks-unified-windows/libshanks_ffi.dll | grep -i '/mingw64/bin/' | awk '{print $3}' | xargs -I '{}' cp '{}' shanks-unified-windows/
          ldd shanks-unified-windows/shanks-unified.exe | grep -i '/mingw64/bin/' | awk '{print $3}' | xargs -I '{}' cp '{}' shanks-unified-windows/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shanks-unified-windows
          path: shanks-unified-windows/
