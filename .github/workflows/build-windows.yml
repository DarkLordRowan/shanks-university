name: Build Windows Release

on:
  push:
    branches: ["main", "vizrd"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false
          update: false
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-mpfr
            mingw-w64-x86_64-eigen3
            mingw-w64-x86_64-gsl
            mingw-w64-x86_64-ccache

      - name: Setup Rust (GNU)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu

      - name: Cache C++ (ccache)
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-
          save-always: true

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "shanks-unified"

      - name: Build Rust Frontend (shanks_unified.exe)
        run: |
          cd shanks-unified
          cargo build --release

      - name: Prepare Archive Folder
        run: |
          mkdir shanks-unified-windows
          cp shanks-unified/target/release/shanks-unified.exe shanks-unified-windows/
          cp -r shanks-unified/config shanks-unified-windows/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shanks-unified-windows
          path: shanks-unified-windows/
