[package]
name = "shanks-unified"
version = "0.1.0"
edition = "2021"
description = "Unified Rust application for series acceleration visualization"
authors = ["Shanks University Team"]
license = "MIT"

[dependencies]
# GUI
egui = "0.31"
eframe = { version = "0.31", features = ["persistence"] }
egui_plot = "0.31"

# FFI
libloading = "0.8"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
indexmap = { version = "2.1", features = ["serde"] }

# Async runtime
tokio = { version = "1.0", features = ["rt-multi-thread", "sync", "fs", "macros"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# File watching for hot-reload
notify = "6.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# UUID for task IDs
uuid = { version = "1.0", features = ["v4", "serde"] }

# Parallel iterators (optional, for batch processing)
rayon = "1.10"

# Export
arrow = "54"
parquet = "54"

[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "shanks-unified"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
