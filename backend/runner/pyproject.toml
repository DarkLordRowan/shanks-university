[project]
name = "shanks-runner"
version = "0.1.0"
description = "runner"
authors = [
    {name = "abyssal",email = "abyssal@example.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "src", from = "." }
]

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.3.0"
mypy = "^1.18.2"
isort = "^7.0.0"
ruff = "^0.14.6"
sphinx = "^9.1.0"
sphinx-copybutton = "^0.5.2"
sphinx-rtd-theme = "^3.0.2"
sphinx-autoapi = "^3.6.1"

[tool.pylint.MASTER]
extension-pkg-allow-list = ["pyshanks"]

[tool.pylint.TYPECHECK]
generated-members = ["pyshanks.*"]
ignored-modules = ["pyshanks"]
