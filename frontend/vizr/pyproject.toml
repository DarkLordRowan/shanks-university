[project]
name = "vizr"
version = "0.1.0"
description = "A high-performance parquet data visualizer (Python version)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars",
    "pyarrow",
    "pyqt6",
    "pyqtgraph",
    "numpy",
    "pandas",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "shanks", from = "src" },	# Модуль для импортов, например `import * from shanks.vizr`
    { include = "vizr", from = "src" },		# Модуль для запуска, например `python3 -m vizr ...`
]
