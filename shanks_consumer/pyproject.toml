[project]
name = "shanks-consumer"
version = "0.1.0"
description = "shanks_consumer"
authors = [
    {name = "abyssal",email = "abyssal@example.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pymongo (>=4.15.0,<5.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "pydantic (>=2.12.4,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "pyarrow (>=22.0.0,<23.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "src", from = "." }
]

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.3.0"
mypy = "^1.18.2"
isort = "^7.0.0"
ruff = "^0.14.6"

[tool.pylint.MASTER]
extension-pkg-allow-list = ["pyshanks"]

[tool.pylint.TYPECHECK]
generated-members = ["pyshanks.*"]
ignored-modules = ["pyshanks"]
